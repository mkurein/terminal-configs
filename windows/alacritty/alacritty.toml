# Alacritty Configuration для Windows + WSL Debian + Zellij
# С поддержкой Alt+стрелки для навигации

[general]
import = [
    "~\\AppData\\Roaming\\alacritty\\themes\\themes\\gruvbox_dark.toml"
    # Другие доступные темы:
    # - tokyo-night.toml
    # - gruvbox_dark.toml
    # - catppuccin_mocha.toml
    # - nord.toml
    # - dracula.toml
]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "wsl"
args = [
    "-d",
    "Ubuntu",
    "--cd",
    "~",
    "--exec",
    "/usr/bin/zsh",
    "-l",
    "-c",
    "~/start-zellij-choose.sh"
]

[window]
opacity = 0.95
startup_mode = "Maximized"

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000

[font]
size = 11.0

[font.normal]
family = "Cascadia Code"
style = "Regular"

[font.bold]
family = "Cascadia Code"
style = "Bold"

[font.italic]
family = "Cascadia Code"
style = "Italic"

[cursor.style]
shape = "Block"
blinking = "On"

[selection]
save_to_clipboard = true

# ===== KEYBOARD BINDINGS =====

# Базовые команды
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

# ===== НАВИГАЦИЯ ZELLIJ: Alt + Стрелки =====
# Эти bindings передают правильные escape-последовательности для Zellij

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001b[1;3D"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001b[1;3C"

[[keyboard.bindings]]
key = "Up"
mods = "Alt"
chars = "\u001b[1;3A"

[[keyboard.bindings]]
key = "Down"
mods = "Alt"
chars = "\u001b[1;3B"

# ===== ДОПОЛНИТЕЛЬНЫЕ КОМАНДЫ =====

# Alt+Left/Right для перемещения по словам в командной строке
[[keyboard.bindings]]
key = "Left"
mods = "Control"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Control"
chars = "\u001bf"

# Удаление слова назад
[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0015"

