[general]
import = [
    "~/.config/alacritty/themes/themes/kanagawa_dragon.toml"
]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
LANG = "en_US.UTF-8"

[font]
size = 15

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0015"
key = "Back"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001Bb"
key = "Left"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u001Bf"
key = "Right"
mods = "Alt"

[window]
decorations = "Buttonless"
dynamic_padding = true
opacity = 0.90
startup_mode = "Maximized"

[window.padding]
x = 15
y = 15

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec ~/start-zellij-choose.sh"]
