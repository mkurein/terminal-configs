[general]
import = [
#    "~/.config/alacritty/themes/themes/kanagawa_dragon.toml"
    "~/.config/alacritty/themes/themes/gruber_darker.toml"
]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
LANG = "en_US.UTF-8"

[font]
size = 15

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Command"

[[keyboard.bindings]]
chars = "\u0015"
key = "Back"
mods = "Command"

[window]
decorations = "Buttonless"
dynamic_padding = true
opacity = 0.90
startup_mode = "Maximized"
option_as_alt = "Both"

[window.padding]
x = 15
y = 15

[terminal.shell]
program = "/Users/olgazaharova/alacritty-start.sh"
